# 友人帐数据（对应 /友人帐/ 页面）
#
# 字段说明：
#   class_name  分组标题（可留空）
#   class_desc  分组说明（可留空）
#   link_list   站点列表，每项四个字段：
#     name      站名
#     link      网址，务必带 https://
#     avatar    头像直链，加载失败会自动回退到 /img/friend_404.gif
#     descr     一句话简介，过长会被省略
#
# 想加分组就再复制一段 - class_name / class_desc / link_list。

- class_name: 友人帐
  class_desc: 欢迎交换友链
  link_list:
    # 下面是示例条目，请替换成真实友链（或直接删掉，连同上面的分组一起）
    - name: ListFX的博客
      link: https://www.listfx.top/
      avatar: /img/avatar.jpg
      descr: 欢迎交换友链
